<!doctype html>
<html
  lang="en"
  class="h-full bg-gray-950 text-white"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Habit Tracker</title>

    <link
      type="text/css"
      href="./vendor/fontawesome/css/all.min.css"
      rel="stylesheet"
    />

    <link
      rel="shortcut icon"
      href="./assets/pic/favicon.ico"
      type="image/x-icon"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
  </head>

  <body
    class="h-full bg-gradient-to-b from-gray-950 via-gray-900 to-gray-950 text-white"
  >
    <!-- ============================= -->
    <!-- APP CONTAINER START -->
    <!-- ============================= -->

    <div
      id="app"
      class="max-w-5xl mx-auto px-8 py-12"
    >
      <!-- ============================= -->
      <!-- HEADER SECTION START -->
      <!-- ============================= -->

      <header class="mb-12 flex justify-between items-center">
        <div class="flex flex-row justify-start items-center gap-4">
          <img src="./assets/pic/logo.png" alt="logo" width="50" height="50">
          <h1 class="text-4xl font-bold tracking-tight">Habit Tracker</h1>
        </div>

        <!-- Theme Toggle Button -->
        <button
          id="theme-toggle"
          class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-xl transition"
        >
          <i class="fa-regular fa-moon"></i>
        </button>
      </header>

      <!-- ============================= -->
      <!-- DASHBOARD SECTION START -->
      <!-- ============================= -->

      <section
        id="dashboard"
        class="grid grid-cols-4 gap-4 mb-8"
      ></section>

      <!-- ============================= -->
      <!-- HABITS SECTION START -->
      <!-- ============================= -->

      <section
        id="habits"
        class="mt-10 space-y-6"
      >
        <!-- ============================= -->
        <!-- CREATE HABIT SECTION START -->
        <!-- ============================= -->

        <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800">
          <div class="flex gap-4">
            <input
              id="habit-input"
              type="text"
              maxlength="50"
              placeholder="Enter new habit..."
              class="flex-1 px-4 py-3 bg-gray-800 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
            />
            <button
              id="add-habit-btn"
              class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 transition rounded-xl font-semibold"
            >
              Add
            </button>
          </div>
        </div>

        <!-- ============================= -->
        <!-- CREATE HABIT SECTION END -->
        <!-- ============================= -->

        <!-- ============================= -->
        <!-- HABIT LIST START -->
        <!-- ============================= -->
        <div
          id="habit-list"
          class="space-y-4"
        ></div>
        <!-- ============================= -->
        <!-- HABIT LIST END -->
        <!-- ============================= -->

        <!-- ============================= -->
        <!-- EDIT MODAL START -->
        <!-- ============================= -->

        <div
          id="edit-modal"
          class="hidden fixed inset-0 z-50 flex items-center justify-center"
        >
          <div
            id="edit-modal-backdrop"
            class="absolute inset-0 bg-black/60 backdrop-blur-sm"
          ></div>

          <div
            class="relative w-full max-w-md mx-4 bg-gray-900 border border-gray-800 rounded-3xl p-6"
          >
            <h2 class="text-xl font-bold">Edit Habit</h2>

            <input
              id="edit-habit-input"
              type="text"
              maxlength="50"
              class="w-full mt-4 px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 outline-none"
            />

            <div class="flex justify-end gap-3 mt-6">
              <button
                id="cancel-edit"
                class="px-4 py-2 rounded-xl bg-gray-800"
              >
                Cancel
              </button>

              <button
                id="confirm-edit"
                class="px-4 py-2 rounded-xl bg-indigo-600"
              >
                Save
              </button>
            </div>
          </div>
        </div>

        <!-- ============================= -->
        <!-- EDIT MODAL END -->
        <!-- ============================= -->

        <!-- ============================= -->
        <!-- DELETE MODAL START -->
        <!-- ============================= -->

        <div
          id="delete-modal"
          class="hidden fixed inset-0 z-50 flex items-center justify-center"
        >
          <!-- backdrop -->

          <div
            id="delete-modal-backdrop"
            class="absolute inset-0 bg-black/60 backdrop-blur-sm"
          ></div>

          <!-- modal -->

          <div
            class="relative w-full max-w-md mx-4 bg-gray-900 border border-gray-800 rounded-3xl p-6 shadow-2xl"
          >
            <h2 class="text-xl font-bold text-white">Delete Habit</h2>

            <p class="mt-3 text-gray-400">
              Are you sure you want to delete this habit?
            </p>

            <div class="flex justify-end gap-3 mt-6">
              <button
                id="cancel-delete"
                class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 transition"
              >
                Cancel
              </button>

              <button
                id="confirm-delete"
                class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 transition"
              >
                Delete
              </button>
            </div>
          </div>
        </div>

        <!-- ============================= -->
        <!-- DELETE MODAL END -->
        <!-- ============================= -->
      </section>

      <!-- ============================= -->
      <!-- UNDO TOAST START -->
      <!-- ============================= -->

      <div
        id="undo-toast"
        class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[999] bg-gray-900/95 backdrop-blur-md border border-gray-700 rounded-3xl px-5 py-4 shadow-2xl min-w-[300px]"
      >
        <div class="flex flex-row justify-between items-center gap-2">
          <!-- Timer -->

          <div class="flex items-center gap-3 text-gray-400">
            <span id="undo-countdown"> 5s </span>

            <!-- Message -->

            <span class="text-white text-sm font-medium"> Habit deleted </span>
          </div>

          <!-- Restore Button -->

          <button
            id="undo-delete-btn"
            class="w-14 h-8 transition flex items-center text-indigo-400 justify-center gap-1"
          >
            <i class="fa-regular fa-rotate-left"></i>

            <!-- Label -->

            <span class="text-sm font-medium"> Undo </span>
          </button>
        </div>
      </div>

      <!-- ============================= -->
      <!-- UNDO TOAST END -->
      <!-- ============================= -->
    </div>

    <!-- ============================= -->
    <!-- APP CONTAINER END -->
    <!-- ============================= -->

    <script
      type="module"
      src="./js/app.js"
    ></script>
    <script src="./vendor/fontawesome/js/all.min.js"></script>
  </body>
</html>
