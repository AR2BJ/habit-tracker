<!doctype html>
<html
  lang="en"
  class="bg-surface text-primary"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Habit Tracker</title>
    <link
      href="./src/assets/css/styles.css"
      rel="stylesheet"
    />
    <link
      type="text/css"
      href="./vendor/fontawesome/css/all.min.css"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="./public/favicon.ico"
      type="image/x-icon"
    />
  </head>

  <body class="min-h-screen bg-surface text-primary">
    <!-- ============================= -->
    <!-- APP CONTAINER START -->
    <!-- ============================= -->

    <div
      id="app"
      class="px-8 py-12 lg:pl-8 transition-all duration-300"
    >
      <div id="header-container"></div>

      <div id="desktop-nav-container"></div>

      <div id="habits-view-container"></div>

      <div id="analytics-view-container"></div>

      <div id="settings-view-container"></div>

      <div id="edit-modals-container"></div>

      <div id="delete-modals-container"></div>

      <div id="help-modal-container"></div>

      <div
        id="notification-container"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-3 min-w-80 max-w-md"
      ></div>
    </div>

    <!-- ============================= -->
    <!-- APP CONTAINER END -->
    <!-- ============================= -->

    <div id="mobile-nav-container"></div>

    <script
      type="module"
      src="./src/app/app.js"
    ></script>
    <script src="./vendor/fontawesome/js/all.min.js"></script>
  </body>
</html>
