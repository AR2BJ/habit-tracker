<!doctype html>
<html
  lang="en"
  class="bg-surface text-primary"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Habit Tracker</title>
    <link
      href="./src/assets/css/styles.css"
      rel="stylesheet"
    />
    <link
      type="text/css"
      href="./vendor/fontawesome/css/all.min.css"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="./public/favicon.ico"
      type="image/x-icon"
    />
  </head>

  <body class="min-h-screen bg-surface text-primary">
    <!-- ============================= -->
    <!-- APP CONTAINER START -->
    <!-- ============================= -->

    <div
      id="app"
      class="px-8 py-12 lg:pl-32"
    >
      <!-- ============================= -->
      <!-- HEADER SECTION START -->
      <!-- ============================= -->

      <header class="mb-12 flex justify-between items-center">
        <div class="flex flex-row justify-start items-center gap-4">
          <img
            src="./public/picture/logo.png"
            alt="logo"
            width="50"
            height="50"
          />
          <h1 class="text-4xl font-bold tracking-tight text-primary">
            Habit Tracker
          </h1>
        </div>

        <!-- Theme Toggle Button -->
        <button
          id="theme-toggle"
          class="w-10 h-10 bg-surface-2 hover:bg-(--color-surface-3) text-primary border border-border rounded-xl transition cursor-pointer flex flex-row justify-center items-center"
        >
          <i class="fa-regular fa-sun text-yellow-400"></i>
        </button>
      </header>

      <div
        id="desktop-nav"
        class="hidden lg:flex fixed left-5 top-5 bottom-5 w-20 flex-col justify-between items-center bg-gray-900/90 dark:bg-surface/80 backdrop-blur-xl border border-border rounded-3xl py-4 shadow-2xl z-50"
      >
        <div class="flex flex-col gap-6 w-full px-3">
          <button
            id="nav-habits"
            class="nav-item justify-center"
            title="Habits"
          >
            <i class="fa-regular fa-list text-xl"></i>
          </button>

          <button
            id="nav-analytics"
            class="nav-item justify-center"
            title="Analytics"
          >
            <i class="fa-regular fa-chart-line text-xl"></i>
          </button>
        </div>

        <div class="w-full px-3">
          <button
            id="nav-settings"
            class="nav-item justify-center"
            title="Settings"
          >
            <i class="fa-regular fa-gear text-xl"></i>
          </button>
        </div>
      </div>

      <!-- ============================= -->
      <!-- HABITS SECTION START -->
      <!-- ============================= -->

      <section
        id="habits-view"
        class="flex flex-col"
      >
        <!-- ============================= -->
        <!-- TABS START -->
        <!-- ============================= -->

        <div
          class="relative flex w-fit bg-surface-2 rounded-2xl p-1 mb-6 border border-border"
        >
          <div
            id="tab-indicator"
            class="absolute top-1 left-1 h-[calc(100%-8px)] w-27.5 rounded-xl bg-brand transition-all duration-300 translate-x-0"
          ></div>

          <button
            id="tab-active"
            class="relative z-10 w-27.5 py-2 text-sm font-medium rounded-l-xl text-(--color-btn-primary-text) transition cursor-pointer"
          >
            Active
          </button>

          <button
            id="tab-archived"
            class="relative z-10 w-27.5 py-2 text-sm font-medium rounded-r-xl text-secondary transition cursor-pointer"
          >
            Archived
          </button>
        </div>

        <!-- ============================= -->
        <!-- TABS END -->
        <!-- ============================= -->
        <div
          id="habits"
          class="w-full"
        >
          <!-- ============================= -->
          <!-- CREATE HABIT SECTION START -->
          <!-- ============================= -->

          <div class="bg-surface p-6 rounded-2xl border border-border">
            <div class="flex gap-4">
              <input
                id="habit-input"
                type="text"
                maxlength="50"
                placeholder="Enter new habit..."
                class="flex-1 px-4 py-3 bg-surface-2 text-primary placeholder:text-(--color-tertiary) rounded-xl outline-none focus:ring-2 focus:ring-brand"
              />
              <button
                id="add-habit-btn"
                class="px-6 py-3 bg-brand hover:bg-(--color-brand-hover) text-(--color-btn-primary-text) transition rounded-xl font-semibold cursor-pointer"
              >
                Add
              </button>
            </div>
          </div>

          <!-- ============================= -->
          <!-- CREATE HABIT SECTION END -->
          <!-- ============================= -->

          <!-- ============================= -->
          <!-- HABIT LIST START -->
          <!-- ============================= -->
          <div
            id="habit-list"
            class="space-y-4 mt-6"
          ></div>
          <!-- ============================= -->
          <!-- HABIT LIST END -->
          <!-- ============================= -->

          <!-- ============================= -->
          <!-- EDIT MODAL START -->
          <!-- ============================= -->

          <div
            id="edit-modal"
            class="min-h-screen fixed inset-0 z-50 hidden items-center justify-center"
          >
            <div
              id="edit-modal-backdrop"
              class="absolute inset-0 bg-black/60 backdrop-blur-sm"
            ></div>

            <div
              class="relative w-full max-w-md mx-4 bg-surface border border-border rounded-3xl p-6 shadow-2xl"
            >
              <h2 class="text-xl font-bold">Edit Habit</h2>

              <input
                id="edit-habit-input"
                type="text"
                maxlength="50"
                class="w-full mt-4 px-4 py-3 rounded-xl bg-surface-2 border border-border text-primary placeholder:text-(--color-tertiary) outline-none focus:ring-2 focus:ring-brand"
              />

              <div class="flex justify-end gap-2 mt-6">
                <button
                  id="cancel-edit"
                  class="px-4 py-2 rounded-xl bg-surface-2 hover:bg-(--color-surface-3) text-primary transition cursor-pointer"
                >
                  Cancel
                </button>

                <button
                  id="confirm-edit"
                  class="px-4 py-2 rounded-xl bg-brand hover:bg-(--color-brand-hover) text-(--color-btn-primary-text) transition cursor-pointer font-medium"
                >
                  Save
                </button>
              </div>
            </div>
          </div>

          <!-- ============================= -->
          <!-- EDIT MODAL END -->
          <!-- ============================= -->

          <!-- ============================= -->
          <!-- DELETE MODAL START -->
          <!-- ============================= -->

          <div
            id="delete-modal"
            class="min-h-screen fixed inset-0 z-50 hidden items-center justify-center"
          >
            <!-- backdrop -->

            <div
              id="delete-modal-backdrop"
              class="absolute inset-0 bg-black/60 backdrop-blur-sm"
            ></div>

            <!-- modal -->

            <div
              class="relative w-full max-w-md mx-4 bg-surface border border-border rounded-3xl p-6 shadow-2xl"
            >
              <h2 class="text-xl font-bold text-primary">Delete Habit</h2>

              <p class="mt-3 text-secondary">
                Are you sure you want to delete this habit?
              </p>

              <div class="flex justify-end gap-2 mt-6">
                <button
                  id="cancel-delete"
                  class="px-4 py-2 rounded-xl bg-surface-2 hover:bg-(--color-surface-3) text-primary transition cursor-pointer"
                >
                  Cancel
                </button>

                <button
                  id="confirm-delete"
                  class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-(--color-btn-primary-text) transition cursor-pointer font-medium"
                >
                  Delete
                </button>
              </div>
            </div>
          </div>

          <!-- ============================= -->
          <!-- DELETE MODAL END -->
          <!-- ============================= -->
        </div>
      </section>

      <section
        id="analytics-view"
        class="hidden"
      >
        <section
          id="dashboard"
          class="grid grid-cols-2 gap-3 mb-6"
        ></section>
      </section>

      <section
        id="settings-view"
        class="hidden"
      >
        <div class="w-full bg-surface border border-border rounded-3xl p-8">
          <h2 class="text-2xl font-bold text-primary">Settings</h2>

          <p class="mt-3 text-gray-400">
            Application settings will be available in V4.
          </p>
        </div>
      </section>

      <!-- ============================= -->
      <!-- UNDO TOAST START -->
      <!-- ============================= -->

      <div
        id="undo-toast"
        class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-surface/95 backdrop-blur-md border border-border rounded-3xl px-5 py-4 shadow-2xl min-w-75"
      >
        <div class="flex flex-row justify-between items-center gap-2">
          <!-- Timer -->

          <div class="flex items-center gap-3 text-secondary">
            <span id="undo-countdown"> 5s </span>

            <!-- Message -->

            <span class="text-primary text-sm font-medium">
              Habit deleted
            </span>
          </div>

          <!-- Restore Button -->

          <button
            id="undo-delete-btn"
            class="h-8 px-3 transition flex items-center text-brand hover:text-(--color-brand-hover) justify-center gap-1 cursor-pointer rounded-lg bg-surface-2 hover:bg-(--color-surface-3) text-sm font-medium"
          >
            <i class="fa-regular fa-rotate-left"></i>

            <!-- Label -->

            <span class="text-sm font-medium"> Undo </span>
          </button>
        </div>

        <!-- ============================= -->
        <!-- UNDO TOAST END -->
        <!-- ============================= -->
      </div>

      <!-- ============================= -->
      <!-- ARCHIVE TOAST START -->
      <!-- ============================= -->

      <div
        id="archive-toast"
        class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-surface/95 backdrop-blur-md border border-border rounded-full px-5 py-4 shadow-2xl min-w-75"
      >
        <div class="flex flex-row justify-between items-center gap-2">
          <div class="py-1.5 flex items-center gap-3 text-secondary">
            <i class="fa-regular fa-box-archive text-yellow-500"></i>

            <span class="text-primary text-sm font-medium">
              Habit archived
            </span>
          </div>
        </div>
      </div>

      <!-- ============================= -->
      <!-- ARCHIVE TOAST START -->
      <!-- ============================= -->

      <!-- ============================= -->
      <!-- RESTORE TOAST START -->
      <!-- ============================= -->

      <div
        id="restore-toast"
        class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-surface/95 backdrop-blur-md border border-border rounded-full px-5 py-4 shadow-2xl min-w-75"
      >
        <div class="flex flex-row justify-between items-center gap-2">
          <div class="py-1.5 flex items-center gap-3 text-secondary">
            <i class="fa-regular fa-rotate-left text-brand"></i>

            <span class="text-primary text-sm font-medium">
              Habit restored
            </span>
          </div>
        </div>
      </div>

      <!-- ============================= -->
      <!-- RESTORE TOAST END -->
      <!-- ============================= -->
    </div>

    <!-- ============================= -->
    <!-- APP CONTAINER END -->
    <!-- ============================= -->

    <nav
      class="lg:hidden fixed bottom-0 left-0 right-0 z-40 flex justify-around items-center bg-surface/90 backdrop-blur-2xl border-t border-border px-6 py-3 shadow-[0_-10px_30px_rgba(0,0,0,0.3)]"
    >
      <button
        id="mobile-habits"
        class="mobile-nav-btn flex flex-col items-center justify-center gap-1 text-secondary"
      >
        <i class="fa-regular fa-list text-lg"></i>
        <span class="text-[10px] font-medium tracking-wide">Habits</span>
      </button>

      <button
        id="mobile-analytics"
        class="mobile-nav-btn flex flex-col items-center justify-center gap-1 text-secondary"
      >
        <i class="fa-regular fa-chart-line text-lg"></i>
        <span class="text-[10px] font-medium tracking-wide">Analytics</span>
      </button>

      <button
        id="mobile-settings"
        class="mobile-nav-btn flex flex-col items-center justify-center gap-1 text-secondary"
      >
        <i class="fa-regular fa-gear text-lg"></i>
        <span class="text-[10px] font-medium tracking-wide">Settings</span>
      </button>
    </nav>

    <script
      type="module"
      src="./src/app/app.js"
    ></script>
    <script src="./vendor/fontawesome/js/all.min.js"></script>
  </body>
</html>
